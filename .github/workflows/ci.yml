name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome pyyaml
      - name: Decoder host test
        run: python3 tests/host_test.py
      - name: Validate config
        run: esphome config tests/ci-device.yaml
      - name: Compile firmware (ESP8266)
        run: esphome compile tests/ci-device.yaml
