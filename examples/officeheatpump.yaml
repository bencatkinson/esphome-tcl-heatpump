# Office heat pump (Rheem RC2IV12HP3BA, TCL-built) - SLWF-01Pro v2.2c on CN16
# Climate control: tclac. Extra sensors: esphome-tcl-heatpump decoder package.
#
# Secrets live in secrets.yaml (wifi_ssid, wifi_password, recovery_pass, ota_pass, api_key).

substitutions:
  device_name: officeheatpump
  humanly_name: Office Heat Pump
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  recovery_pass: !secret recovery_pass
  ota_pass: !secret ota_pass
  api_key: !secret api_key
  uart_rx: GPIO14
  uart_tx: GPIO12
  receive_led: GPIO6
  transmit_led: GPIO4

packages:
  remote_package:
    url: https://github.com/sorz2122/tclac.git
    ref: master
    files:
      - packages/core.yaml
    refresh: 30s
  tcl_decoder:
    url: https://github.com/Bencatkinson/esphome-tcl-heatpump
    ref: main
    files:
      - packages/tcl-decoder.yaml
      - packages/tclac-half-degree.yaml   # 0.5 °C setpoints; must come after tclac
    refresh: 1d

esp8266:
  board: esp12e

wifi:
  use_address: 192.168.2.25

# Keep your English swing/airflow select: block here unchanged.
# Remove your old uart: debug:, sensor: and binary_sensor: blocks; the package replaces them.
